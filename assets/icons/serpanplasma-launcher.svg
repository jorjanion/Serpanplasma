<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="serpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Capsule/Pill Background -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Serpentine Minimalist Curves -->
  <path d="M 14 18 C 14 14, 22 14, 24 18 C 26 22, 34 22, 34 26 C 34 32, 24 34, 20 30" 
        fill="none" 
        stroke="url(#serpGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Head Accent Dot -->
  <circle cx="14" cy="18" r="2.8" fill="#f8fafc" />

  <!-- Tail Accent Dot -->
  <circle cx="20" cy="30" r="2.2" fill="#38bdf8" />
</svg>
