# Serpanplasma Kitty Configuration (Obsidian Theme)
font_family      JetBrainsMono Nerd Font SemiBold
bold_font        JetBrainsMono Nerd Font Bold
italic_font      auto
bold_italic_font auto
font_size        12.0

cursor           #38bdf8
cursor_text_color #0f172a
cursor_shape     beam
cursor_blink_interval 0.5

foreground       #f8fafc
background       #0f172a
background_opacity 0.90

selection_foreground #0f172a
selection_background #38bdf8

# Black
color0 #1e293b
color8 #475569

# Red
color1 #f87171
color9 #fca5a5

# Green
color2  #34d399
color10 #6ee7b7

# Yellow
color3  #fbbf24
color11 #fde047

# Blue
color4  #38bdf8
color12 #7dd3fc

# Magenta
color5  #c084fc
color13 #e879f9

# Cyan
color6  #22d3ee
color14 #67e8f9

# White
color7  #e2e8f0
color15 #ffffff

window_padding_width 12
confirm_os_window_close 0
enable_audio_bell no
