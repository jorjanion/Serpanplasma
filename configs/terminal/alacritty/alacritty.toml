[window]
padding = { x = 12, y = 12 }
opacity = 0.92

[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "SemiBold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[colors.primary]
background = "#0f172a"
foreground = "#f8fafc"

[colors.cursor]
text = "#0f172a"
cursor = "#38bdf8"

[colors.selection]
text = "#0f172a"
background = "#38bdf8"

[colors.normal]
