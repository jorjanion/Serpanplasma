green   = "#34d399"
yellow  = "#fbbf24"
blue    = "#38bdf8"
magenta = "#c084fc"
cyan    = "#22d3ee"
white   = "#e2e8f0"

[colors.bright]
black   = "#475569"
red     = "#fca5a5"
green   = "#6ee7b7"
yellow  = "#fde047"
blue    = "#7dd3fc"
magenta = "#e879f9"
